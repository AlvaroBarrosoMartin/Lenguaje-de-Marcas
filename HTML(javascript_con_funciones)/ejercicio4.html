<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="resultado"></p>

    
    <script>
        // Funciones
        function CalcularMedia(num1, num2){
            let suma = num1 + num2;
            let media = suma / 2;
            return media; 
        }
        
        // Programa
        let numero1 = 5;
        let numero2 = 10;
        
        
        let resultado = CalcularMedia(numero1, numero2);
        
       
        document.write(resultado);
    </script>
</body>
</html>
