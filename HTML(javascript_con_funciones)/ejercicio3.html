<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="resultado"></p>

    <!-- El script se coloca al final del body -->
    <script>
        // Funciones
        function Suma(num1, num2){
            let suma = num1 + num2;
            return suma;
        }
        
        // Programa
        let numero1 = 5;
        let numero2 = 10;
        document.write(Suma(numero1, numero2)+"<br>");

        numero1 = 13;
        numero2 = 16;

        document.write(Suma(numero1, numero2));

    </script>
</body>
</html>
