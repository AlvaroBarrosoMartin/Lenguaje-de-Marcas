<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="resultado"></p>

    
    <script>
        // Funciones
        function Visualizar(nom){
            document.write("hola <br> "+ nom );
            document.getElementById("resultado").innerHTML = "HOLA SOY " + nom;
        }
        
        // Programa
        let nombre = "Alvaro";
        Visualizar(nombre);
    </script>
</body>
</html>
