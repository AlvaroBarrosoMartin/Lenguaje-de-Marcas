<!-- Ddo el nomvre de una persona y su edad a continuacion el nombre de otra persona y su edad, visualizar el que tenga mas edad de los 2 si ambas edades son iguales 
  -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<script>
    let nombre1 = prompt("Ingrese el nombre de la primera persona:");   
    let edad1 = parseInt(prompt("Ingrese la edad de la primera persona:"));
    let nombre2 = prompt("Ingrese el nombre de la segunda persona:");
    let edad2 = parseInt(prompt("Ingrese la edad de la segunda persona:"));

    if (edad1 == edad2) {
        alert("Ambas personas tienen la misma edad: " + edad1 + " años.");
    } else if (edad2 > edad1) {
        alert("La persona con más edad es: " + nombre2 + " con " + edad2 + " años.");
    } else {
        alert("La persona con más edad es: " + nombre1 + " con " + edad1 + " años.");
    }

</script>
    
</body>
</html>
