<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Del siguiente array mostrar los sueldos mayores a 1500


        //---- Programa principal -----
        let datos = [1000,3000,2400,500,1500];
        Visualizar(datos);

        //---- Funciones -----
        function Visualizar(datos){
            for(let i=0; i < datos.length; i++){
               if(datos[i] > 1500){
                    alert(datos[i]);
               } 
            }
        }


    </script>
</body>
</html>
